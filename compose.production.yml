# Use with compose.stack.yml on a host with DNS pointing at this machine.
services:
  api:
    ports: !reset []
  gateway:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      HOLD_LINE_DOMAIN: ${HOLD_LINE_DOMAIN:?Set the DNS name for this host}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      api: {condition: service_healthy}
volumes:
  caddydata:
  caddyconfig:
